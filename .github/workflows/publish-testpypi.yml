# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: 'Publish Python 🐍 distribution 📦 to PyPI and TestPyPI'

on:
  push:
    branches: [ 'dev' ]

jobs:
  build:
    name: 'Build distribution 📦'
    runs-on: 'ubuntu-latest'

    steps:
    - uses: 'actions/checkout@v6'
      with:
        persist-credentials: false

    - name: 'Set up Python 🐍'
      uses: 'actions/setup-python@v6'
      with:
        python-version: '3.12.x'

    - name: 'Install 💽 requirements'
      run: 'python3 -m pip install -r src/count_anywhere/requirements.txt'
    #- name: 'Install 💽 requirements (dev)'
    #  run: 'python3 -m pip install -r src/count_anywhere/requirements.dev.txt'

    - name: 'Generate 🖨 Qt resource file.'
      run: 'bash tools/make-rcc.sh'
    #- name: 'Generate 🖨 requirements file.'
    #  run: 'bash tools/make-python-requirements.sh'

    - name: 'Install 💽 pypa/build'
      run: 'python3 -m pip install build --user'

    - name: 'Build 🔨'
      run: 'python3 -m build'

    - name: 'Store 💼 the distribution packages 📦'
      uses: 'actions/upload-artifact@v5'
      with:
        name: 'python-package-distributions'
        path: 'dist/'

  #publish-to-pypi:
  #  name: 'Publish Python 🐍 distribution 📦 to PyPI'
  #  if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
  #  needs:
  #  - 'build'
  #  runs-on: 'ubuntu-latest'
  #
  #  environment:
  #    name: 'pypi'
  #    url: 'https://pypi.org/p/tfwr-expand'
  #
  #  permissions:
  #    id-token: 'write'  # IMPORTANT: mandatory for trusted publishing
  #
  #  steps:
  #  - name: 'Download all the dists'
  #    uses: 'actions/download-artifact@v6'
  #    with:
  #      name: 'python-package-distributions'
  #      path: 'dist/'
  #  - name: 'Publish distribution 📦 to PyPI'
  #    uses: 'pypa/gh-action-pypi-publish@release/v1'

  publish-to-testpypi:
    name: 'Publish Python 🐍 distribution 📦 to TestPyPI'
    needs:
    - 'build'
    runs-on: 'ubuntu-latest'

    environment:
      name: 'testpypi'
      url: 'https://test.pypi.org/p/tfwr-expand'

    permissions:
      id-token: 'write'  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: 'Download 📥 all the dists'
      uses: 'actions/download-artifact@v6'
      with:
        name: 'python-package-distributions'
        path: 'dist/'

    - name: 'Publish 📤 distribution 📦 to TestPyPI'
      uses: 'pypa/gh-action-pypi-publish@release/v1'
      with:
        repository-url: 'https://test.pypi.org/legacy/'

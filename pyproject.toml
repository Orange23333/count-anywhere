[project]
name = "count-anywhere"
version = "0.1.0a*.dev*"
authors = [
  { name="Orange 233", email="orange_233@foxmail.com" },
]
description = "A tool for counting anything easily."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"  # I don't know which version is the lowest.
keywords = ["count", "counting", "counter", "tool", "countanywhere", "count anywhere"]
classifiers = [
    "Programming Language :: Python :: 3",
    #"Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)"
]
license = "GPL-2.0-only"
license-files = ["LICEN[CS]E*"]

[dependency-groups]
base = [
    "any-singleton == 1.1.0",
    "pyside6 >= 6.10.0",
    "rtree >= 1.4.0",
    "ruamel-yaml >= 0.19.0",
    #"pywin32",
]
dev = [
    #"coverage",
    "pytest >= 9.0.0",
    "pytest-cov >= 7.0.0",
    "ruff >= 0.15.0",
]
all = [
    {include-group = "base"},
    {include-group = "dev"}
]

[build-system]
requires = ["uv_build >= 0.10.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/Orange23333/CountAnywhere"
Repository = "https://github.com/Orange23333/CountAnywhere"
#Documentation = "https://github.com/Orange23333/CountAnywhere/blob/main/docs/"
Issues = "https://github.com/Orange23333/CountAnywhere/issues"
#Changelog = "https://github.com/Orange23333/CountAnywhere/blob/main/CHANGELOG.md"

[project.gui-scripts]
count-anywhere = "count_anywhere.__main__:main"

[tool.pyside6-project]
files = ["main.py", "requirements.txt", "resources.qrc", "widgets/config_window.py", "widgets/about.ui"]
